<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晶核固定团本</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=20260827-2">
  <script src="config.js?v=20260901-6"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-sync.js?v=20260901-1"></script>
</head>
<body>
  <header class="topbar compact-topbar">
    <span class="logo">⚔️ 晶核固定团本</span>
    <span id="gameWeekLabel" class="game-week-label"></span>
  </header>

  <main class="mode active" id="mode-game">
    <nav class="game-tabs core-game-tabs" aria-label="核心功能">
      <button class="game-tab active" data-game-page="daily-star">⚔️ 固定团本</button>
    </nav>

    <div class="game-main core-game-main">
      <section class="game-page active" id="game-page-daily-star">
        <div class="raid-starfield-shell daily-starfield-shell">
          <div class="raid-starfield-heading">
            <div>
              <span class="raid-starfield-kicker">FIXED RAID ROUTE</span>
              <h1>⚔️ 固定团本</h1>
              <p>16个固定队伍不变；团本1、团本2按各自七天窗口动态补齐，并分别记录完成。</p>
            </div>
            <div class="starfield-heading-actions">
              <div class="starfield-date-nav">
                <button type="button" onclick="switchDay(-1)">◀</button>
                <strong id="dailyStarDate"></strong>
                <button type="button" onclick="switchDay(1)">▶</button>
                <button type="button" onclick="switchDay(0)">今天</button>
              </div>
              <button class="game-btn raid-refresh-btn" type="button" onclick="refreshWeeklyRaids()">↻ 手动校正轮换 +1</button>
              <button class="game-btn raid-refresh-btn" type="button" onclick="toggleRosterManager()">👥 账号与角色管理</button>
            </div>
          </div>
          <section class="core-roster-manager" id="coreRosterManager" hidden>
            <div class="core-roster-manager-head"><div><span>ACCOUNT, ROLE & REGION</span><h2>账号与角色管理</h2><p>角色名称、团本等级和大区标注修改后立即保存。</p></div><button type="button" onclick="toggleRosterManager(false)">关闭</button></div>
            <div id="coreRosterManagerContent"></div>
          </section>
          <div id="dailyStarfieldContent"></div>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <section class="coin-calculator" id="coinCalculator">
    <div class="coin-calculator-card">
      <h2>📊 金币套利计算器（双端计税）</h2>
      <p class="coin-calculator-sub">固定成本 1 元/单 · 收购端扣税 + 卖出端扣税 · 自动计算盈亏平衡收购价</p>
      <div class="coin-calc-inputs">
        <label>📦 单次交易量 (M)<input type="number" data-calc="amount" value="1000" step="100"><span>万金币</span></label>
        <label>⬇️ 你的收购价 (X)<input type="number" data-calc="buyPrice" value="44.05" step="0.01"><span>万/元</span></label>
        <label>⬆️ 你的卖出价 (S)<input type="number" data-calc="sellPrice" value="38.5" step="0.01"><span>万/元</span></label>
        <label>🧾 收购端税率<input type="number" data-calc="taxIn" value="2.7" step="0.1"><span>%</span></label>
        <label>🧾 卖出端税率<input type="number" data-calc="taxOut" value="1" step="0.1"><span>%</span></label>
        <label>📌 固定成本<input type="number" data-calc="fixedCost" value="1" step="0.1"><span>元/单</span></label>
      </div>
      <div class="coin-calc-results"><div><small>⚖️ 盈亏平衡收购价</small><strong data-calc-result="breakEven">--</strong><span>你的收购价 <b data-calc-result="compare">--</b></span></div><div><small>💰 单笔净利润</small><strong data-calc-result="profit">--</strong></div><div><small>📈 收益率</small><strong data-calc-result="yield">--</strong></div><div><small>📋 当前状态</small><strong data-calc-result="status">--</strong></div></div>
      <p class="coin-calculator-note">临界值表示每 1 元至少能买到多少万金币才不亏，已包含双端税费。</p>
    </div>
  </section>
  <script src="coin-calculator.js?v=20260901-1"></script>
  <script src="game.js?v=20260901-11"></script>
  <script>
    window._gameInited = true;
    initGame();
    console.log('⚔️ 晶核固定团本已就绪');
  </script>
</body>
</html>
